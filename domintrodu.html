<!--changing heading text-->
<!DOCTYPE html>
<html>
<head>
    <title>DOCUMENT OBJECT MODEL</title>
</head>
<body>
    <h1 id="heading">hello world</h1>
    <script>
        document.getElementById("heading").innerHTML =  "welcome to javaScript";
    </script>
</body>
</html>

<!--changing paragraph text -->
<!DOCTYPE html>
<html>
<head>
    <title>
        DOM changing paragraph text
    </title>
</head>
<body>
    <p id="message">i am learning english</p>
    <script>
        document.getElementById("message").textContent = " Iam learning javascript dom"
    </script>
</body>
</html>
